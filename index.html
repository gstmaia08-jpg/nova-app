<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NOVA — prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">
<style>
:root{--v:#7752DB;--r:#CE7AB3;--p:#E68CBE;--l:#B684C6;--c:#FFF3C4;--ink:#24163F;--bg:#FBF7FF;--card:#fff;--mut:#7a6d94;--ln:#ece4f7;--out:#2a1b4d;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#150d28;--card:#21163b;--ink:#f6efff;--mut:#a99bc7;--ln:#33264f;--out:#0c0718}}
:root[data-theme=dark]{--bg:#150d28;--card:#21163b;--ink:#f6efff;--mut:#a99bc7;--ln:#33264f;--out:#0c0718}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html,body{height:100%}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--out);color:var(--ink);display:flex;justify-content:center;align-items:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--p);outline-offset:2px}
#ph{width:390px;height:min(820px,100%);background:var(--bg);border-radius:44px;overflow:hidden;position:relative;box-shadow:0 0 0 9px #0d0818,0 30px 80px #0008}
@media(max-width:430px){#ph{width:100%;height:100%;border-radius:0;box-shadow:none}}
#app{height:100%;display:flex;flex-direction:column}.sc{flex:1;overflow-y:auto;padding:54px 20px 20px;scrollbar-width:none}.sc::-webkit-scrollbar{display:none}
h1{font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.02em}h2{font-size:22px;font-weight:800;letter-spacing:-.01em}h3{font-size:16px;font-weight:600}
.mut{color:var(--mut);font-size:14px}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.g{display:grid;gap:12px}
.btn{background:var(--v);color:#fff;border-radius:999px;padding:16px 22px;font-weight:600;font-size:16px;width:100%;box-shadow:0 8px 20px #7752db55;transition:transform .15s}.btn:active{transform:scale(.97)}
.btn.s{background:var(--card);color:var(--v);box-shadow:inset 0 0 0 2px var(--ln)}.btn.sm{width:auto;padding:9px 16px;font-size:14px;box-shadow:none}.btn.cr{background:var(--c);color:#24163F;box-shadow:none}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 2px 0 var(--ln)}
.chip{padding:9px 15px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ln);font-size:14px;font-weight:600;white-space:nowrap;transition:.15s}.chip.on{background:var(--v);color:#fff;box-shadow:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 10px;margin:0 -20px;scrollbar-width:none}
.tile{border-radius:24px;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;font-size:54px;position:relative;overflow:hidden}
.t0{background:linear-gradient(135deg,var(--p),var(--v))}.t1{background:linear-gradient(135deg,var(--v),var(--l))}.t2{background:linear-gradient(150deg,#d86aa8,#8a5fd6)}.t3{background:linear-gradient(135deg,var(--r),var(--l))}
.tag{font-size:12px;font-weight:600;background:var(--c);color:#4a3a1a;border-radius:999px;padding:4px 10px}
.heart{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:#fffd;font-size:19px;color:var(--v)}
.tabs{display:flex;background:var(--card);padding:8px 8px 22px;box-shadow:0 -1px 0 var(--ln)}.tabs button{flex:1;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);padding:6px 0;border-radius:16px}.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tabs .on{color:var(--v)}.tabs .on span{background:var(--c);border-radius:999px;padding:3px 14px;color:#4a2fb0}.tabs span{padding:3px 14px}
.hero{background:linear-gradient(145deg,#4a2fb0 0%,#7752DB 45%,#B0509B 100%);color:#fff}
.bar{height:12px;border-radius:9px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--p),var(--v));transition:width .5s}
.opt{background:var(--card);border-radius:22px;padding:16px 10px;display:grid;justify-items:center;gap:6px;font-weight:600;box-shadow:inset 0 0 0 2px var(--ln);font-size:15px}.opt b{font-size:30px}.opt.on{box-shadow:inset 0 0 0 3px var(--v);background:var(--c);color:#24163F}
input[type=text],input[type=date],input[type=number]{width:100%;font:inherit;font-size:18px;padding:15px 18px;border-radius:18px;border:2px solid var(--ln);background:var(--card);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--v)}.big{font-size:52px;font-weight:800;letter-spacing:-.03em}
.pg{display:flex;gap:6px}.pg i{flex:1;height:5px;border-radius:5px;background:var(--ln)}.pg i.on{background:var(--v)}
.back{width:40px;height:40px;border-radius:50%;background:var(--card);font-size:20px;box-shadow:inset 0 0 0 1.5px var(--ln)}
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}
.logo{height:34px}.spin{width:64px;height:64px;border-radius:50%;border:6px solid #fff5;border-top-color:var(--c);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.pill{display:flex;gap:10px;align-items:center}.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--ln);color:var(--mut);flex:none}.dot.ok{background:var(--v);color:#fff}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><div id="ph"><div id="app"></div><div class="toast" id="to"></div></div>

let keep=0;
function render(k){const sc=document.querySelector('.sc'),y=sc?sc.scrollTop:0,ch=document.querySelector('.chips'),cx=ch?ch.scrollLeft:0;
const v=V[S.scr]();const tb=TB.some(t=>t[0]==S.scr)||S.scr=='budget'?`<nav class="tabs">${TB.map(([k,l])=>`<button class="${S.tab==k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${ic[k]}</svg><span>${l}</span></button>`).join('')}</nav>`:'';
document.getElementById('app').innerHTML=v+tb;if(k){const n=document.querySelector('.sc');if(n)n.scrollTop=y;const c=document.querySelector('.chips');if(c)c.scrollLeft=cx}}
const card=(d,big)=>`<div class="card" style="padding:10px" onclick="go('detail',{det:'${d.id}',from:S.scr})"><div class="tile t${d.t}">${art(d)}<button class="heart" aria-label="Favori" onclick="fav('${d.id}',event)">${S.fav.includes(d.id)?'♥':'♡'}</button></div><div style="padding:12px 6px 4px" class="g"><div class="row sp"><h3>${d.name}</h3><b>★ ${d.rt}</b></div><div class="mut">${d.loc} · ${d.dist} km${d.cap?` · jusqu’à ${d.cap} pers.`:''}</div><div class="row" style="flex-wrap:wrap">${d.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="row sp"><span><span class="mut">À partir de </span><b>${eur(d.price)}</b></span><button class="btn sm ${S.sel.includes(d.id)?'s':''}" onclick="event.stopPropagation();add('${d.id}')">${S.sel.includes(d.id)?'Retirer':big?'Voir le lieu':'Ajouter'}</button></div></div></div>`;
const head=(t,b)=>`<div class="row sp" style="margin-bottom:16px"><div class="row">${b?`<button class="back" aria-label="Retour" onclick="${b}">←</button>`:''}<h2>${t}</h2></div></div>`;
const nm=()=>{const n=(S.name||'').trim();return n?n[0].toUpperCase()+n.slice(1):''},ini=()=>(nm()[0]||'N');
const emp=(t,p)=>`<div class="card hero" style="color:#fff;padding:24px"><h2>${t}</h2><p style="margin:8px 0 18px;opacity:.95">${p}</p><button class="btn cr" onclick="go('wiz',{step:0})">+ Créer un événement</button></div>`;
function wnx(n){const s=S.step;if(s==0&&!S.ev.type)return toast('Choisis un type d’événement');if(s==2&&!S.ev.city.trim())return toast('Indique un lieu');go('wiz',{step:n})}
const V={
name:()=>`<div class="sc" style="display:flex;flex-direction:column;gap:20px;padding-top:70px"><button class="back" aria-label="Retour" onclick="go('splash')">←</button><h1>C’est quoi ton prénom ?</h1><p class="mut" style="font-size:16px">Pour que NOVA te parle à toi.</p><input type="text" id="nin" value="${S.name}" placeholder="Ton prénom" autocomplete="given-name" maxlength="20" aria-label="Prénom" autofocus oninput="S.name=this.value" onkeydown="if(event.key=='Enter')nx()"><div style="flex:1"></div><button class="btn" onclick="nx()">Continuer</button></div>`,
splash:()=>`<div class="sc hero" style="display:grid;align-content:space-between;text-align:center;padding:90px 28px 40px"><div></div><div class="g" style="justify-items:center"><img src="${LOGO}" style="width:250px;height:auto" alt="NOVA"><p style="font-size:20px;font-weight:600;color:#fff">Imagine. Organize. Celebrate.</p></div><button class="btn cr" onclick="go('name')">Commencer</button></div>`,
onb:()=>{const o=[['Ton événement, tes envies.','Dis-nous ce que tu veux fêter, NOVA construit l’événement qui te ressemble.','🎉','t0'],['Tout au même endroit.','Lieux, DJ, traiteurs, photobooth… on réunit les prestataires, plus besoin de tout chercher.','🧩','t1'],['Dans ton budget.','Chaque suggestion respecte ton budget. Tu vois toujours ce qu’il te reste.','💸','t2']][S.ob];
return`<div class="sc" style="display:grid;align-content:space-between;padding-top:70px"><div class="tile ${o[3]}" style="aspect-ratio:1;font-size:110px">${o[2]}</div><div class="g"><h1>${o[0]}</h1><p class="mut" style="font-size:16px">${o[1]}</p></div><div class="g"><div class="pg">${[0,1,2].map(i=>`<i class="${i<=S.ob?'on':''}"></i>`).join('')}</div><button class="btn" onclick="${S.ob<2?`go('onb',{ob:${S.ob+1}})`:`go('home')`}">${S.ob<2?'Suivant':'C’est parti'}</button></div></div>`},
home:()=>{if(!S.has)return`<div class="sc"><div class="row sp"><span class="hero" style="padding:9px 15px;border-radius:14px;display:inline-block"><img src="${LOGO}" style="height:20px;width:auto;display:block" alt="NOVA"></span><button class="back" aria-label="Profil" onclick="go('me')">${ini()}</button></div><h1 style="margin:22px 0 4px">Salut${nm()?' '+nm():''} ! 👋</h1><p class="mut" style="font-size:16px;margin-bottom:18px">Tu imagines, NOVA organise le reste.</p>${emp('Prépare ton premier événement','Réponds à quelques questions, NOVA te propose un plan dans ton budget.')}<button class="btn s" style="margin-top:14px" onclick="go('explore')">Explorer les prestataires</button></div>`;const rec=D.filter(d=>!S.sel.includes(d.id)&&S.ev.prefs.map(p=>PM[p]).includes(d.cat)).slice(0,5);
return`<div class="sc"><div class="row sp"><span class="hero" style="padding:9px 15px;border-radius:14px;display:inline-block"><img src="${LOGO}" style="height:20px;width:auto;display:block" alt="NOVA"></span><button class="back" aria-label="Profil" onclick="go('me')">${ini()}</button></div>
<h1 style="margin:22px 0 4px">Salut${nm()?' '+nm():''} ! 👋</h1><p class="mut" style="font-size:16px;margin-bottom:18px">Ton ${S.ev.type.toLowerCase()} est dans ${days()} jours.</p>
<div class="card hero" style="color:#fff;padding:20px" class="g"><div class="row sp"><h2>${S.ev.type} — ${fd(S.ev.date).split(' ').slice(1).join(' ')}</h2></div><p style="opacity:.9;margin:4px 0 14px">${S.ev.guests} invités · Budget ${eur(S.ev.budget)}</p><div class="bar" style="background:#fff4"><i style="width:${prog()}%;background:var(--c)"></i></div><p style="margin:8px 0 16px;font-weight:600">${prog()}% de ton événement est prêt</p><button class="btn cr" onclick="go('event')">Continuer mon événement</button></div>
<div class="card row sp" style="margin-top:12px" onclick="go('budget')"><div><div class="mut">Restant</div><b style="font-size:22px">${eur(S.ev.budget-spent())}</b></div><span class="mut">Voir le budget →</span></div>
<div class="row sp" style="margin:24px 0 12px"><h2>Pour ton événement</h2></div><div class="chips" style="gap:14px">${rec.map(d=>`<div style="min-width:250px">${card(d)}</div>`).join('')}</div>
<button class="btn s" style="margin-top:14px" onclick="go('wiz',{step:0})">+ Créer un événement</button></div>`},
wiz:()=>{const e=S.ev,s=S.step,N=7;let b='',t='';
if(s==0){t='Quel événement tu prépares ?';b=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${TYPES.map(([n,i])=>`<button class="opt ${e.type==n?'on':''}" onclick="S.ev.type='${n}';render()"><b>${i}</b>${n}</button>`).join('')}</div>`}
if(s==1){t='C’est pour quand ?';const sat=['2026-10-24','2026-10-31','2026-11-07','2026-11-14','2026-11-21','2026-11-28'];b=`<div class="big" style="font-size:30px;margin-bottom:14px">${fd(e.date)}</div><div class="chips" style="flex-wrap:wrap;margin:0;padding:0 0 14px;overflow:visible">${sat.map(d=>`<button class="chip ${e.date==d?'on':''}" onclick="S.ev.date='${d}';render()">${fd(d).split(' ').slice(1).join(' ')}</button>`).join('')}</div><input type="date" value="${e.date}" min="2026-10-08" aria-label="Date" onchange="S.ev.date=this.value;render()">`}
if(s==2){t='Où veux-tu organiser ton événement ?';b=`<input type="text" value="${e.city}" aria-label="Lieu" oninput="S.ev.city=this.value"><button class="btn s" style="margin-top:12px" onclick="S.ev.city='Lyon 7e (ma position)';render();toast('Position utilisée')">📍 Utiliser ma position</button><div class="chips" style="margin-top:14px">${['Lyon, France','Villeurbanne','Lyon 3e','Lyon 6e'].map(c=>`<button class="chip" onclick="S.ev.city='${c}';render()">${c}</button>`).join('')}</div>`}
if(s==3){t='Combien serez-vous ?';b=`<div class="big" style="text-align:center">${e.guests}<span class="mut" style="font-size:18px;font-weight:600"> personnes</span></div><input type="range" min="5" max="200" value="${e.guests}" aria-label="Invités" oninput="S.ev.guests=+this.value;this.previousElementSibling.firstChild.nodeValue=this.value"><div class="chips" style="margin-top:12px">${[10,20,35,50,80,120].map(n=>`<button class="chip ${e.guests==n?'on':''}" onclick="S.ev.guests=${n};render()">${n}</button>`).join('')}</div>`}
if(s==4){t='Quel est ton budget ?';b=`<div class="big" style="text-align:center">${eur(e.budget)}</div><input type="range" min="200" max="5000" step="50" value="${e.budget}" aria-label="Budget" oninput="S.ev.budget=+this.value;this.previousElementSibling.textContent=eur(+this.value)"><p class="mut" style="text-align:center;margin-top:8px">Soit environ ${Math.round(e.budget/e.guests)} € par personne</p><div class="chips" style="margin-top:12px">${[500,1000,1500,2500,4000].map(n=>`<button class="chip ${e.budget==n?'on':''}" onclick="S.ev.budget=${n};render()">${eur(n)}</button>`).join('')}</div>`}
if(s==5){t='Quelle ambiance veux-tu ?';b=`<p class="mut" style="margin-bottom:12px">Tu peux en choisir plusieurs.</p><div class="row" style="flex-wrap:wrap">${MOODS.map(m=>`<button class="chip ${e.moods.includes(m)?'on':''}" style="font-size:16px;padding:12px 18px" onclick="tog(S.ev.moods,'${m}');render()">${m}</button>`).join('')}</div>`}
if(s==6){t='Il te faut quoi ?';b=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">${PREFS.map(([k,i,l])=>`<button class="opt ${e.prefs.includes(k)?'on':''}" style="font-size:13px" onclick="tog(S.ev.prefs,'${k}');render()"><b>${i}</b>${l}</button>`).join('')}</div>`}
return`<div class="sc" style="display:flex;flex-direction:column;gap:20px"><div class="row"><button class="back" aria-label="Retour" onclick="${s?`go('wiz',{step:${s-1}})`:`go('home')`}">←</button><div class="pg" style="flex:1">${Array.from({length:N},(_,i)=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div></div><h1>${t}</h1><div style="flex:1">${b}</div><button class="btn" onclick="${s<N-1?`wnx(${s+1})`:'plan()'}">${s<N-1?'Continuer':'Voir mes suggestions'}</button></div>`},
load:()=>`<div class="sc hero" style="display:grid;place-items:center;text-align:center"><div class="g" style="justify-items:center"><div class="spin"></div><h2>NOVA prépare ton événement…</h2><p style="opacity:.9">On compare lieux et prestataires à ton budget</p></div></div>`,
res:()=>{const t=S.plan.reduce((a,i)=>a+$(i).price,0);return`<div class="sc"><h1 style="margin-bottom:6px">Voilà ce qu’on a trouvé pour toi ✨</h1><p class="mut" style="margin-bottom:16px">Un plan pour ${S.ev.guests} personnes, ambiance ${S.ev.moods.join(' + ').toLowerCase()||'à ton image'}.</p><div class="card" style="margin-bottom:14px"><div class="row sp"><b>Total du plan</b><b style="color:var(--v)">${eur(t)}</b></div><div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,t/S.ev.budget*100)}%"></i></div><p class="mut" style="margin-top:6px">Il te reste ${eur(S.ev.budget-t)} sur ${eur(S.ev.budget)}</p></div><div class="g">${S.plan.map(i=>card($(i))).join('')}</div><button class="btn" style="margin-top:16px" onclick="S.sel=[...S.plan];S.has=true;go('home')">Adopter ce plan</button><button class="btn s" style="margin-top:10px" onclick="S.sel=[...S.plan];S.has=true;go('explore')">Adopter et modifier dans Explorer</button></div>`},
explore:()=>{let L=D.filter(d=>d.cat==S.cat);const f=S.fl;if(f.includes('b'))L=L.filter(d=>d.price<=700);if(f.includes('r'))L=L.filter(d=>d.rt>=4.7);if(f.includes('d'))L=L.filter(d=>d.dist<=3);if(f.includes('c'))L=L.filter(d=>!d.cap||d.cap>=S.ev.guests);
return`<div class="sc">${head('Explorer')}<div class="chips">${CATS.map(c=>`<button class="chip ${S.cat==c?'on':''}" onclick="S.cat='${c}';render(true)">${CI[c]} ${c}</button>`).join('')}</div><div class="chips">${[['b','Budget ≤ 700 €'],['d','Moins de 3 km'],['c','Pour '+S.ev.guests+' pers.'],['r','★ 4,7+']].map(([k,l])=>`<button class="chip ${f.includes(k)?'on':''}" onclick="tog(S.fl,'${k}');render(true)">${l}</button>`).join('')}</div><div class="g" style="margin-top:6px">${L.map(d=>card(d,S.cat=='Lieux')).join('')||'<p class="mut">Aucun résultat. Retire un filtre pour voir plus d’options.</p>'}</div></div>`},
detail:()=>{const d=$(S.det),on=S.sel.includes(d.id);return`<div class="sc" style="padding:0 0 20px"><div class="tile t${d.t}" style="border-radius:0 0 32px 32px;aspect-ratio:4/3;font-size:90px;padding-top:30px"><button class="back" style="position:absolute;top:50px;left:16px" aria-label="Retour" onclick="go(S.from)">←</button><button class="heart" style="top:50px;right:16px" aria-label="Favori" onclick="fav('${d.id}',event)">${S.fav.includes(d.id)?'♥':'♡'}</button>${art(d)}</div><div class="g" style="padding:18px 20px"><div class="row sp"><h1>${d.name}</h1><b>★ ${d.rt}</b></div><div class="mut">${d.cat} · ${d.loc} · ${d.dist} km</div><div class="row" style="flex-wrap:wrap">${d.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><p>${d.desc}</p><div class="card row sp"><div><div class="mut">À partir de</div><b style="font-size:24px">${eur(d.price)}</b></div><span class="tag" style="background:var(--v);color:#fff">Dispo le ${fd(S.ev.date).split(' ').slice(1).join(' ')}</span></div><h3>Inclus</h3>${d.inc.map(i=>`<div class="pill"><span class="dot ok">✓</span>${i}</div>`).join('')}<h3 style="margin-top:6px">Avis</h3>${REV.map(r=>`<div class="card"><b>${r[0]}</b> <span class="mut">★★★★★</span><p class="mut" style="margin-top:4px">${r[1]}</p></div>`).join('')}<button class="btn" onclick="add('${d.id}')">${on?'Retirer de mon événement':'Ajouter à mon événement'}</button><button class="btn s" onclick="toast('Message envoyé à ${d.name}')">Contacter</button></div></div>`},
event:()=>{if(!S.has)return`<div class="sc">${head('Mon événement')}${emp('Aucun événement pour l’instant','Crée ton événement pour suivre ton budget et tes prestataires.')}</div>`;const e=S.ev;return`<div class="sc">${head('Mon événement')}<div class="card hero" style="color:#fff;padding:20px"><h1>Mon ${e.type.toLowerCase()}</h1><p style="margin:6px 0 14px;opacity:.95">${fd(e.date).split(' ').slice(1).join(' ')} · ${e.city.split(',')[0]}<br>${e.guests} invités · ${eur(e.budget)}</p><div class="bar" style="background:#fff4"><i style="width:${prog()}%;background:var(--c)"></i></div><p style="margin-top:8px;font-weight:600">${prog()}% prêt</p></div>
<div class="card" style="margin-top:12px" onclick="go('budget')"><div class="row sp"><b>Budget</b><span class="mut">${eur(spent())} / ${eur(e.budget)} →</span></div></div>
<h2 style="margin:20px 0 10px">À faire</h2><div class="card g">${tgt().map(c=>{const o=done(c),s=S.sel.map($).find(x=>x.cat==c);return`<div class="pill" onclick="${o?`go('detail',{det:'${s.id}',from:'event'})`:`go('explore',{cat:'${c}'})`}"><span class="dot ${o?'ok':''}">${o?'✓':''}</span><div style="flex:1"><b>${o?s.name:c+' à choisir'}</b>${o?`<div class="mut">${c}</div>`:''}</div><span class="mut">${o?eur(s.price):'Choisir'}</span></div>`}).join('')}</div>
<h2 style="margin:20px 0 10px">Mes prestataires</h2><div class="g">${S.sel.map(i=>{const d=$(i);return`<div class="card row sp"><div class="row" onclick="go('detail',{det:'${i}',from:'event'})"><div class="tile t${d.t}" style="width:52px;aspect-ratio:1;font-size:24px;border-radius:16px">${art(d)}</div><div><b>${d.name}</b><div class="mut">${eur(d.price)}</div></div></div><button class="btn sm s" onclick="add('${i}')">Retirer</button></div>`}).join('')||'<p class="mut">Aucun prestataire pour l’instant. Ajoutes-en un depuis Explorer.</p>'}</div><button class="btn" style="margin-top:16px" onclick="go('explore')">Ajouter un prestataire</button></div>`},
budget:()=>{if(!S.has)return`<div class="sc">${head('Budget')}${emp('Pas encore de budget','Il apparaîtra dès que tu auras créé ton événement.')}</div>`;const T=S.ev.budget,s=spent(),r=T-s,p=Math.min(1,s/T),C=2*Math.PI*54;return`<div class="sc">${head('Budget','go(\'event\')')}<div class="card" style="text-align:center"><svg viewBox="0 0 130 130" width="190"><circle cx="65" cy="65" r="54" fill="none" stroke="var(--ln)" stroke-width="14"/><circle cx="65" cy="65" r="54" fill="none" stroke="${r<0?'#e5484d':'var(--v)'}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 65 65)" style="transition:.5s"/><text x="65" y="63" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)" font-family="inherit">${Math.round(s/T*100)}%</text><text x="65" y="80" text-anchor="middle" font-size="9" fill="var(--mut)" font-family="inherit">utilisé</text></svg><p style="font-weight:600;color:${r<0?'#e5484d':'var(--v)'}">${r<0?'Tu dépasses ton budget de '+eur(-r):'Tu restes dans ton budget 👌'}</p></div>
<div class="card g" style="margin-top:12px"><div class="row sp"><span class="mut">Budget total</span><b>${eur(T)}</b></div><div class="row sp"><span class="mut">Dépensé / sélectionné</span><b>${eur(s)}</b></div><div class="row sp"><span>Restant</span><b style="font-size:24px;color:${r<0?'#e5484d':'var(--v)'}">${eur(r)}</b></div></div>
<h2 style="margin:20px 0 10px">Répartition</h2><div class="card g">${S.sel.map($).map(d=>`<div class="g" style="gap:6px"><div class="row sp"><span>${d.cat} · ${d.name}</span><b>${eur(d.price)}</b></div><div class="bar"><i style="width:${d.price/T*100}%"></i></div></div>`).join('')||'<p class="mut">Rien de sélectionné.</p>'}</div><button class="btn" style="margin-top:16px" onclick="go('explore')">Ajouter un prestataire</button></div>`},
favs:()=>`<div class="sc">${head('Mes favoris')}<div class="g">${S.fav.map($).map(d=>card(d)).join('')||'<p class="mut">Pas encore de favori. Touche le cœur sur un lieu ou un prestataire pour le retrouver ici.</p>'}</div></div>`,
me:()=>`<div class="sc"><div class="g" style="justify-items:center;text-align:center;margin-bottom:20px"><div class="hero" style="width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:800">${ini()}</div><h1>${nm()||'Mon profil'}</h1><span class="mut">Lyon</span></div><div class="card g">${[['Mes événements',(S.has?'1 en cours':'Aucun'),"go('event')"],['Mes favoris',S.fav.length+' enregistrés',"go('favs')"],['Préférences',S.ev.moods[0]?'Ambiance '+S.ev.moods[0].toLowerCase():'À définir',"toast('Bientôt disponible')"],['Notifications','Activées',"toast('Notifications mises à jour')"],['Réglages','',"toast('Bientôt disponible')"]].map(a=>`<button class="row sp" style="padding:6px 0;text-align:left" onclick="${a[2]}"><b>${a[0]}</b><span class="mut">${a[1]} ›</span></button>`).join('')}</div><button class="btn s" style="margin-top:16px" onclick="go('splash')">Revoir l’intro</button></div>`};
function nx(){if(!(S.name||'').trim()){toast('Entre ton prénom pour continuer');document.getElementById('nin')?.focus();return}go('onb',{ob:0})}
function plan(){go('load');setTimeout(()=>{const T=S.ev.budget;let p=[],tot=0;[...new Set(['Lieux',...S.ev.prefs.map(c=>PM[c])])].forEach(c=>{const o=D.filter(d=>d.cat==c&&(!d.cap||d.cap>=S.ev.guests)).sort((a,b)=>b.rt-a.rt||a.price-b.price).find(d=>tot+d.price<=T)||D.filter(d=>d.cat==c).sort((a,b)=>a.price-b.price)[0];if(o){p.push(o.id);tot+=o.price}});S.plan=p;go('res')},2200)}
render();
</script></body></html>
